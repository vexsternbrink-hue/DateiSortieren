[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dateisortieren"
version = "0.1.0"
description = "KI-gestützte Datei-Organisation für Downloads und Dokumente – lokaler Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "watchdog>=4.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "rich>=13.0",
    "pypdf>=4.0",
    "pillow>=10.0",
    "imagehash>=4.3",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.40"]
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17"]
docx = ["python-docx>=1.1"]
all = ["anthropic>=1.0", "openai>=1.40", "pytesseract>=0.3.10", "pdf2image>=1.17", "python-docx>=1.1"]
dev = ["pytest>=8.0"]

[project.scripts]
dateisortieren = "dateisortieren.cli:main"

[tool.setuptools.packages.find]
include = ["dateisortieren*"]

[tool.setuptools.package-data]
dateisortieren = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
